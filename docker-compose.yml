services:
  mongo:
    image: mongo:7
    container_name: g-dash-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: g-dash-api
    container_name: g-dash-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/g-dash
      PORT: 4100
      ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-3000}
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
      PUBLIC_API_URL: http://localhost:${API_PORT:-4100}
    ports:
      - "${API_PORT:-4100}:4100"
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider",
         "http://127.0.0.1:4100/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4100}/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
    image: g-dash-web
    container_name: g-dash-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4100/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  mongo-data:
