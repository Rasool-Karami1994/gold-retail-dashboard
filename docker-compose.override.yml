# Development overrides. Compose loads this automatically, so plain
# `docker compose up` is the dev stack and you have to opt out for production:
#
#   docker compose -f docker-compose.yml up --build
#
# What changes: both apps switch to their `dev` image stage and run from
# bind-mounted source, so an edit on the host reloads inside the container --
# `tsx watch` for the API, `next dev` for the web app. No rebuild per change.

services:
  api:
    build:
      target: dev
    image: g-dash-api-dev
    environment:
      NODE_ENV: development
      LOG_FORMAT: dev
      # Inotify events do not cross a bind mount from a Windows or macOS host
      # into the Linux VM, so chokidar (under `tsx watch`) sees nothing and the
      # container silently stops reloading -- it looks like the watcher died
      # rather than like a mount problem. Polling costs some idle CPU and is the
      # only thing that works. Harmless on a Linux host, where inotify already
      # works and this just adds a stat loop.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      # Source from the host. This shadows /repo/apps/api wholesale, including
      # the node_modules the image installed -- hence the anonymous volume
      # below, which mounts the image's copy back on top. Without it every
      # import fails the moment the bind mount appears.
      - ./apps/api:/repo/apps/api
      - /repo/apps/api/node_modules

  web:
    build:
      target: dev
    image: g-dash-web-dev
    environment:
      NODE_ENV: development
      # In the dev stage these ARE read at boot: `next dev` compiles on demand,
      # so there is no baked-in bundle to disagree with them. The production
      # image gets the same values as build args instead -- see
      # docker-compose.yml.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4100}/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
      API_INTERNAL_URL: http://api:4100/api/v1
      # Same inotify-across-a-bind-mount problem as the API. Next's watcher is
      # webpack's, so it reads WATCHPACK_POLLING rather than the chokidar vars.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/repo/apps/web
      - /repo/apps/web/node_modules
      # .next as an anonymous volume too: the dev server writes it constantly,
      # and letting that traffic cross a Windows/macOS bind mount is both slow
      # and the usual cause of the corrupt-cache symptom in CLAUDE.md.
      - /repo/apps/web/.next
    depends_on:
      api:
        # Not service_healthy in dev: the API's healthcheck has a 30s start
        # period and nothing in the web app calls it at boot, so waiting only
        # delays the dev server.
        condition: service_started
